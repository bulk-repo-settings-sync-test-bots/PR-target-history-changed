name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "test"

  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "test"
      - uses: actions/cache@v6
        with:
          path: prime-numbers
          key: ${{ runner.os }}-primes
